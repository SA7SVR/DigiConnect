name: Build DigiConnect

# Builds ready-to-run DigiConnect binaries for Linux, Windows and macOS (Intel + Apple Silicon).
# Runs automatically on every push to main and on version tags (v1.0.0 …), and can be run by hand
# from the Actions tab (Run workflow). Finished files appear under the run's "Artifacts", and a
# tag push also creates a Release with the files attached.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ---------------- LINUX ----------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libpulse-dev \
            libxkbcommon-dev libfontconfig1 libfreetype6 fuse libfuse2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          modules: 'qtmultimedia qtserialport'
          cache: true
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/DigiConnect AppDir/usr/bin/
          cp images/droidstar.png AppDir/usr/share/icons/hicolor/256x256/apps/digiconnect.png || true
          printf '[Desktop Entry]\nType=Application\nName=DigiConnect\nExec=DigiConnect\nIcon=digiconnect\nCategories=AudioVideo;HamRadio;\n' > AppDir/usr/share/applications/digiconnect.desktop
          export QML_SOURCES_PATHS="$PWD"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/digiconnect.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/digiconnect.png || true
          mv DigiConnect*.AppImage DigiConnect-Linux-x86_64.AppImage 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: DigiConnect-Linux
          if-no-files-found: warn
          path: |
            DigiConnect-Linux-x86_64.AppImage
            build/DigiConnect

  # ---------------- WINDOWS ----------------
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: windows
          arch: win64_msvc2019_64
          modules: 'qtmultimedia qtserialport'
          cache: true
      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Deploy Qt runtime
        run: |
          mkdir dist
          copy build\DigiConnect.exe dist\
          windeployqt --release --qmldir . dist\DigiConnect.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DigiConnect-Windows
          path: dist

  # ---------------- macOS (Intel + Apple Silicon) ----------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13   # Intel
            label: Intel
          - runner: macos-14   # Apple Silicon
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          modules: 'qtmultimedia qtserialport'
          cache: true
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Bundle + DMG
        run: |
          macdeployqt build/DigiConnect.app -qmldir=. -dmg || macdeployqt build/DigiConnect.app -qmldir=.
          # ad-hoc sign so it opens with right-click → Open (no "damaged")
          codesign --force --deep --sign - build/DigiConnect.app || true
          mv build/DigiConnect.dmg DigiConnect-macOS-${{ matrix.label }}.dmg || true
      - uses: actions/upload-artifact@v4
        with:
          name: DigiConnect-macOS-${{ matrix.label }}
          path: |
            DigiConnect-macOS-${{ matrix.label }}.dmg
            build/DigiConnect.app

  # ---------------- RELEASE (on tag) ----------------
  release:
    needs: [ linux, windows, macos ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
