name: macOS Intel crash debug (temporary)

on:
  push:
    branches: [ mac-debug ]
  workflow_dispatch:

defaults:
  run:
    working-directory: digiconnect-py

jobs:
  intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with: { version: '6.9.3', modules: 'qtmultimedia qtserialport', cache: true }
      - name: Build engine (with debug symbols)
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel
          "$QT_ROOT_DIR/bin/macdeployqt" build/dcengine.app
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: DMR refused-login test and the stack of the crashed thread
        continue-on-error: true
        run: |
          rm -f ~/Library/Logs/DiagnosticReports/dcengine* 2>/dev/null
          python3 engine/tests/check_dmr_login.py "$PWD/build/dcengine.app/Contents/MacOS/dcengine" 2>&1 | tail -12
          sleep 8
          python3 - <<'PY'
          import glob, json, os
          for f in sorted(glob.glob(os.path.expanduser("~/Library/Logs/DiagnosticReports/dcengine*"))):
              txt = open(f, errors="replace").read()
              try:
                  body = json.loads(txt.split("\n", 1)[1])
              except Exception as ex:
                  print("cannot parse", f, ex); print(txt[:1500]); continue
              print("====", f, body.get("exception"))
              ft = body.get("faultingThread")
              imgs = body.get("usedImages", [])
              for i, th in enumerate(body.get("threads", [])):
                  mark = "  <<< CRASHED" if i == ft else ""
                  print(f"-- thread {i} {th.get('name', '')} {th.get('queue', '')}{mark}")
                  if i == ft or th.get("triggered"):
                      for fr in th.get("frames", [])[:40]:
                          im = imgs[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex") is not None and fr["imageIndex"] < len(imgs) else "?"
                          print(f"   {im:30s} {fr.get('symbol', '?')} + {fr.get('symbolLocation', '')}  {fr.get('sourceFile', '')}:{fr.get('sourceLine', '')}")
          PY
